name: Hangar account server image

# The image of the optional Hangar account's server (crates/hangar-cloud,
# docs/native/cloud.md): built and checked as a host will run it whenever
# the server or what it is built from changes, and published to
# ghcr.io/hangar-ai/hangar-cloud from main (`latest` and the commit) and from
# a release tag (its version). crates/hangar-cloud/compose.yaml runs it.
# A pull request builds and checks it, and publishes nothing.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - crates/hangar-cloud/**
      - crates/hangar-cloud-api/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/cloud-image.yml
  pull_request:
    paths:
      - crates/hangar-cloud/**
      - crates/hangar-cloud-api/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/cloud-image.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hangar-cloud
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=hangar-cloud
            org.opencontainers.image.description=The server of the optional Hangar account

      # Built once into the local image store, checked, then pushed from the
      # same build cache.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/hangar-cloud/Dockerfile
          platforms: linux/amd64
          load: true
          tags: hangar-cloud:check
          cache-from: type=gha,scope=hangar-cloud
          cache-to: type=gha,mode=max,scope=hangar-cloud

      # What docs/native/cloud.md asks of a first deployment: it starts with
      # no secret and says so, answers /health and refuses /v1 without a
      # token, reports healthy, writes its database as its own user on a
      # read-only root, and stops quickly on SIGTERM.
      - name: Check the image as a host runs it
        run: |
          set -euo pipefail
          docker run -d --name check -p 127.0.0.1:8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -v hangar-cloud-check:/data hangar-cloud:check
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          docker logs check
          curl -fsS http://127.0.0.1:8080/health | tee /dev/stderr | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/me)" = 401
          docker logs check | grep -q 'not configured'
          docker exec check /usr/local/bin/hangar-cloud health
          for _ in $(seq 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' check)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "health: $status"
          test "$status" = healthy
          docker exec check stat -c '%u %s %n' /data/hangar-cloud.sqlite | tee /dev/stderr | grep -q '^10001 '
          start=$(date +%s)
          docker stop check
          took=$(( $(date +%s) - start ))
          echo "stopped in ${took}s"
          test "$took" -le 5

      - name: Sign in to GitHub's registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/hangar-cloud/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=hangar-cloud
