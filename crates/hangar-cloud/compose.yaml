# The server of the optional Hangar account (docs/native/cloud.md, "Deploy").
#
# On the host, in a folder of its own:
#
#   base=https://raw.githubusercontent.com/hangar-ai/hangar/main/crates/hangar-cloud
#   curl -fsSLO "$base/compose.yaml"
#   curl -fsSL "$base/hangar-cloud.env.example" -o hangar-cloud.env
#   chmod 600 hangar-cloud.env      # then fill in the OAuth clients
#
#   docker compose up -d                       # a reverse proxy on this host reaches 127.0.0.1:8080
#   docker compose --profile tunnel up -d      # or a Cloudflare Tunnel (cloudflared.env), no proxy at all
#
# The image is the one CI publishes (.github/workflows/cloud-image.yml), for
# x86-64. From a clone of the repository, `docker compose up -d --build`
# builds it from source instead (an arm64 host, a change being tried).
#
# Update: `docker compose pull && docker compose up -d`. The volume
# `hangar-cloud-data` is the whole state of the service: back it up (the
# document's "Backups").

name: hangar-cloud

services:
  hangar-cloud:
    image: ghcr.io/hangar-ai/hangar-cloud:${HANGAR_CLOUD_TAG:-latest}
    build:
      context: ../..
      dockerfile: crates/hangar-cloud/Dockerfile
    container_name: hangar-cloud
    restart: unless-stopped
    # The OAuth clients' ids and secrets, and the settings that differ from
    # the defaults: hangar-cloud.env.example says which.
    env_file: hangar-cloud.env
    # The host only, never the internet: the rate limits read the caller's
    # address from what Cloudflare forwards, which a direct caller would write
    # themselves (docs/native/cloud.md, "Cloudflare").
    ports:
      - "127.0.0.1:${HANGAR_CLOUD_PORT:-8080}:8080"
    volumes:
      - data:/data
    # It writes its database in /data and nothing anywhere else; SQLite's
    # temporary files go to /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # A Cloudflare Tunnel to the server, for a host that runs no reverse proxy
  # and opens no port: only with `--profile tunnel`. Its public hostname,
  # hangar-account.simnjs.fr, points at the service http://hangar-cloud:8080.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    container_name: hangar-cloud-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    # TUNNEL_TOKEN, and nothing of the server's secrets.
    env_file:
      - path: cloudflared.env
        required: false
    depends_on:
      hangar-cloud:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  data:
    # Named outright, so that the backup and restore commands of the document
    # find it whatever the folder is called.
    name: hangar-cloud-data
